# MatClaw daemon stack. Run: docker compose up -d
# Ensure .env exists and contains TELEGRAM_BOT_TOKEN (and optionally TELEGRAM_CHAT_ID).

services:
  matclaw-daemon:
    build: .
    image: matclaw-daemon:latest
    container_name: matclaw-daemon
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - MATCLAW_SENTRY__DATA_IN_PATH=/app/data_in
    volumes:
      - matclaw_data_in:/app/data_in
      - matclaw_reports:/app/reports
      - matclaw_chromadb:/app/.matclaw_chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from src.matclaw.matlab.matlab_bridge import MatlabBridge; from src.matclaw.config import MatClawSettings; s = MatClawSettings(); b = MatlabBridge(settings=s.matlab); b.start(); exit(0 if b.is_healthy() else 1)"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s

volumes:
  matclaw_data_in:
  matclaw_reports:
  matclaw_chromadb:
