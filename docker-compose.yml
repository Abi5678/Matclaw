services:
  matclaw:
    build: .
    image: matclaw:latest
    container_name: matclaw
    ports:
      - "8000:8000"
    env_file:
      - .env          # copy .env.example → .env and fill in your API keys
    environment:
      MATCLAW_MATLAB__ENABLED: "false"   # set true only if MATLAB engine wheel is installed
      PYTHONUNBUFFERED: "1"
    volumes:
      - matclaw_chromadb:/app/.matclaw_chromadb
      - matclaw_sessions:/app/.matclaw_sessions.sqlite3
      - matclaw_plots:/app/plots
      - matclaw_projects:/app/projects
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  matclaw_chromadb:
  matclaw_sessions:
  matclaw_plots:
  matclaw_projects:
